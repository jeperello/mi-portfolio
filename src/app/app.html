<app-intro *ngIf="showIntro" (finished)="onIntroFinished()"></app-intro>

<!-- FONDO DE NIEVE - Optimizado con variables CSS -->
<div class="snow-container" aria-hidden="true">
  <div class="shooting-star"></div>
  <div class="shooting-star shooting-star-reverse"></div>
    <div *ngFor="let star of twinkleStars(); let i = index"
      class="twinkle-star"
      [class.fixed]="star.fixed"
      [style.--top]="star.top + '%'"
      [style.--left]="star.left + '%'"
      [style.--twinkle-duration]="star.duration + 's'"
      [style.--twinkle-delay]="star.delay + 's'"
      [style.--twinkle-size]="star.size + 'px'"
      (animationiteration)="relocateTwinkleStar(i)"></div>
  <div *ngFor="let snowflake of snowflakes; let i = index" class="snowflake" [style.--left]="((i * 47) % 100) + '%'"
    [style.--duration]="(16 + ((i * 31) % 16)) + 's'" [style.--delay]="-((i * 17) % 12) + 's'" [style.--size]="(2 + ((i * 13) % 5)) + 'px'"
    [style.--opacity]="(0.6 + ((i * 19) % 5) * 0.1)" [style.--drift]="(((i * 29) % 101) - 50) + 'px'">
  </div>
</div>

<div class="app-content" [style.display]="showIntro ? 'none' : 'block'">
  <app-navbar></app-navbar>

  <main>
    <router-outlet></router-outlet>
  </main>

  <app-chat></app-chat>

  <app-analytics-dashboard></app-analytics-dashboard>
</div>
