@if (showIntro()) {
  <app-intro (finished)="onIntroFinished()"></app-intro>
}

<!-- FONDO DE NIEVE - Optimizado con variables CSS -->
<div class="snow-container" aria-hidden="true">
  <div class="shooting-star"></div>
  <div class="shooting-star shooting-star-reverse"></div>
  @for (star of twinkleStars(); track $index; let index = $index) {
    <div
      class="twinkle-star"
      [class.fixed]="star.fixed"
      [style.--top]="star.top + '%'"
      [style.--left]="star.left + '%'"
      [style.--twinkle-duration]="star.duration + 's'"
      [style.--twinkle-delay]="star.delay + 's'"
      [style.--twinkle-size]="star.size + 'px'"
      (animationiteration)="relocateTwinkleStar(index)"></div>
  }
  @for (snowflake of snowflakes; track $index; let index = $index) {
    <div class="snowflake" [style.--left]="((index * 47) % 100) + '%'"
      [style.--duration]="(16 + ((index * 31) % 16)) + 's'" [style.--delay]="-((index * 17) % 12) + 's'" [style.--size]="(2 + ((index * 13) % 5)) + 'px'"
      [style.--opacity]="0.6 + ((index * 19) % 5) * 0.1" [style.--drift]="(((index * 29) % 101) - 50) + 'px'">
    </div>
  }
</div>

<div class="app-content" [style.display]="showIntro() ? 'none' : 'block'">
  <app-navbar></app-navbar>

  <main>
    <router-outlet></router-outlet>
  </main>

  <app-chat></app-chat>

  <app-analytics-dashboard></app-analytics-dashboard>

  <!-- OVNI Cósmico de Pruebas -->
  <app-ufo></app-ufo>
</div>
