<app-intro *ngIf="showIntro" (finished)="onIntroFinished()"></app-intro>

<!-- FONDO DE NIEVE - Optimizado con variables CSS -->
<div class="snow-container" aria-hidden="true">
  <div *ngFor="let snowflake of snowflakes; let i = index" 
       class="snowflake"
       [style.--left]="(i * 2) + '%'"
       [style.--duration]="(10 + (i % 15)) + 's'"
       [style.--delay]="-(i * 0.4) + 's'"
       [style.--size]="(2 + (i % 5)) + 'px'"
       [style.--opacity]="(0.2 + (i % 8) * 0.1)"
       [style.--drift]="((i % 100) - 50) + 'px'">
  </div>
</div>

<div [style.display]="showIntro ? 'none' : 'block'">
  <app-navbar></app-navbar>

  <main>
    <router-outlet></router-outlet>
  </main>

  <app-chat></app-chat>
  
  <app-analytics-dashboard *ngIf="analytics.localMode"></app-analytics-dashboard>
</div>
