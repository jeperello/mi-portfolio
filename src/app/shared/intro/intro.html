<div class="intro-overlay" [class.fade-out]="!isVisible()">
  <div class="mini-cup">☕</div>
  
  <div class="terminal-window">
    <div class="log-container">
      @for (log of logs; track log.message; let index = $index) {
        <div [class]="'log-line ' + log.type" [style.animation-delay]="(index * 0.18) + 's'">
        {{ log.message }}
        </div>
      }
    </div>

    <div class="progress-section">
      <span class="loading-text">BOOTING JORGE PERELLO's PORTFOLIO...</span>
      <div class="progress-bar">
        <div class="fill"></div>
      </div>
    </div>

    <div class="status-check">
      <div>JDK 21: <span>READY</span></div>
      <div>LOOM: <span>ACTIVE</span></div>
      <div>FLUX: <span>STREAMING</span></div>
    </div>

    <button type="button" class="skip-intro" (click)="dismiss()">
      Saltar introducción
    </button>
  </div>
</div>
