<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-logo">
      <a class="navbar-profile-link"
         href="https://www.linkedin.com/in/jorge-perello-sw-developer/"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="Abrir el perfil de LinkedIn de Jorge Perello">
        <img src="assets/profile/profile.jpeg" alt="Jorge Perello" class="navbar-profile-img">
      </a>
      <a routerLink="/about" class="navbar-identity" (click)="isMenuOpen.set(false)">
        <span>Jorge Perello</span>
        <span class="full-title-suffix">Full Stack Developer (Java + Spring Boot + Angular)</span>
      </a>
    </div>
    
    <ul id="primary-navigation"
        class="navbar-links"
        [class.active]="isMenuOpen()"
        (keydown.escape)="isMenuOpen.set(false)">
      <li><a routerLink="/" 
             appTracker="nav-projects"
             routerLinkActive="active" 
             [routerLinkActiveOptions]="{exact: true}"
             (click)="isMenuOpen.set(false)">Proyectos</a></li>
     <!-- <li><a routerLink="/fleet" 
             appTracker="nav-fleet"
             routerLinkActive="active" 
             (click)="isMenuOpen.set(false)">Fleet 50/50</a></li>-->
      <li class="mobile-only">
        <a routerLink="/project-map" 
           appTracker="nav-project-map"
           routerLinkActive="active" 
           (click)="isMenuOpen.set(false)">Mapa Semántico</a>
      </li>
      <li class="nav-item-relative">
        <a routerLink="/blog" 
           appTracker="nav-blog"
           routerLinkActive="active" 
           (mouseenter)="hideTooltip()" (click)="hideTooltip(); isMenuOpen.set(false)">
          Mi Blog
        </a>
        @if (showBlogTooltip()) {
          <div class="nav-tooltip">
            ¡Nuevo Post! ✍️
            <div class="tooltip-arrow"></div>
          </div>
        }
      </li>
      <li><a routerLink="/about" 
             appTracker="nav-about"
             routerLinkActive="active" 
             [routerLinkActiveOptions]="{exact: true}"
             (click)="isMenuOpen.set(false)">Sobre Mí</a></li>
      <li><a routerLink="/about" 
             appTracker="nav-contact"
             fragment="contact"
             (click)="isMenuOpen.set(false)">Contacto</a></li>
      <li class="nav-controls">
        <button class="sound-toggle"
                type="button"
                [class.is-playing]="themeService.isSoundPlaying()"
                [class.is-muted]="!themeService.soundEnabled()"
                [attr.aria-label]="themeService.soundEnabled() ? 'Apagar sonido' : 'Activar sonido'"
                [attr.title]="themeService.soundEnabled() ? 'Apagar sonido' : 'Activar sonido'"
                appTracker="btn-toggle-sound"
                (click)="themeService.toggleSound()">
          <span class="sound-icon" aria-hidden="true">{{ themeService.soundEnabled() ? '🔊' : '🔇' }}</span>
        </button>
        <app-theme-toggle></app-theme-toggle>
      </li>
    </ul>

    <button class="navbar-toggle" 
            type="button"
            (click)="isMenuOpen.set(!isMenuOpen())"
            [attr.aria-expanded]="isMenuOpen()"
            aria-controls="primary-navigation"
            [attr.aria-label]="isMenuOpen() ? 'Cerrar navegación' : 'Abrir navegación'">
      <div class="hamburger" [class.open]="isMenuOpen()">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </button>
  </div>
</nav>
